<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skriv deg videre</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div class="container">
        <h1>Skriv deg videre</h1>
        <div id="story-selection">
            <label for="story">Velg et eventyr:</label>
            <select id="story" onchange="loadStory()">
                <option value="">--Velg et eventyr--</option>
                <!-- Options will be populated by JavaScript -->
            </select>
            <label for="difficulty" style="display:block;margin-top:10px;">Vanskelighetsgrad:</label>
            <select id="difficulty" aria-label="Difficulty">
                <option value="standard">Realistisk</option>
                <option value="forgiving">Enkel</option>
            </select>
        </div>
        <div id="typing-area">
            <div class="monitor">
                <div class="monitor-top">
                    <div id="status-left">Completed: <span id="status-completed">0</span>/<span id="status-total">0</span></div>
                    <div id="status-center">00:00</div>
                    <div id="status-right"><span id="status-percent">0%</span></div>
                </div>
                <div class="monitor-screen">
                    <p id="story-text" class="story" aria-hidden="false"></p>
                </div>
                <div class="monitor-bottom">
                    <div class="progress-wrap" aria-hidden="true">
                        <div id="progress-bar" class="progress-bar"></div>
                    </div>
                </div>
            </div>

            <label class="sr-only" for="user-input">Type the story here</label>
            <textarea id="user-input" placeholder="Start typing here..." oninput="checkInput()" aria-label="Type the story here" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
            <div id="feedback" role="status" aria-live="polite"></div>
            <!-- Accordion showing unlocked part of the story -->
            <div class="accordion">
                <button id="unlocked-toggle" class="accordion-toggle" aria-expanded="false">Show unlocked part of story</button>
                <div id="unlocked-content" class="accordion-content" hidden>
                    <div id="unlocked-text" class="unlocked-text"></div>
                    <div style="margin-top:8px;">
                        <button id="reset-story" class="reset-button">Reset Story</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="src/app.js"></script>
</body>
</html>
